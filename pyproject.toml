[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unconstrain"
version = "0.1.0"
description = "Audit and undo demand censoring in retail sales data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
io = ["pyarrow>=14"]
plots = ["matplotlib>=3.7"]
deep = ["pypots", "pygrinder", "benchpots", "ai4ts", "h5py", "tensorboard"]

[project.scripts]
unconstrain = "unconstrain.cli:main"

[tool.setuptools]
packages = ["unconstrain"]
